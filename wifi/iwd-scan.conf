# Merged into /etc/iwd/main.conf by install-wifi.sh.
#
# This is a mitigation, not the fix -- the fix is the explicit connect in
# wifi-up. Measured: capping these alone still left a 114s reconnect, because
# the real blocker is autoconnect discarding an unrankable BSS, not the scan
# pacing. What this does buy is a bounded worst case if wifi-up is not the
# thing that recovers the link: iwd's default ladder doubles out to 300s
# between scans, which is an absurd wait on a laptop that suspends all day.
[Scan]
InitialPeriodicScanInterval=3
MaximumPeriodicScanInterval=10
