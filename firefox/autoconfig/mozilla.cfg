// autoconfig — first line must be a comment

lockPref("browser.startup.page", 1);
lockPref("browser.startup.homepage", "file:///home/slava/dotfiles/firefox/home/index.html");

// Everything else lives in the dotfiles tree so it can be edited without root.
// This file is the only piece that has to be copied into /usr/lib/firefox.
// Firefox 159 refuses loadSubScript on file:// URIs ("Trying to load untrusted
// URI"), so map the directory to a resource:// alias and load through that.
try {
  let res = Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  res.setSubstitution(
    "dotfiles",
    Services.io.newURI("file:///home/slava/dotfiles/firefox/autoconfig/")
  );
  Services.scriptloader.loadSubScript("resource://dotfiles/main.js", this);
} catch(e) { Cu.reportError(e); }
