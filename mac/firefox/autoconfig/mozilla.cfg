// autoconfig — first line must be a comment

lockPref("browser.startup.page", 1);
lockPref("browser.startup.homepage", "http://localhost:8347/index.html");

try {
  // Set new tab page to custom home page
  ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs")
    .AboutNewTab.newTabURL = "http://localhost:8347/index.html";

  let { BrowserWindowTracker } = ChromeUtils.importESModule(
    "resource:///modules/BrowserWindowTracker.sys.mjs"
  );

  let focusContent = () => {
    let win = BrowserWindowTracker.getTopWindow();
    win?.gBrowser?.selectedBrowser?.focus();
  };

  // Focus page content (not address bar) when opening a new tab
  Services.obs.addObserver(focusContent, "browser-open-newtab-start");

  // Focus page content (not address bar) on startup
  Services.obs.addObserver(focusContent, "sessionstore-windows-restored");

  // Focus page content (not address bar) when a new browser window opens.
  // Firefox focuses the URL bar after the window loads, so defer with a
  // timeout to win the race and focus the content browser instead.
  let focusContentInWindow = (win) => {
    win.setTimeout(() => win.gBrowser?.selectedBrowser?.focus(), 0);
  };

  // Address-bar auto-hide toggle (pairs with userChrome.css [navhidden] rules).
  // Each browser window starts with the nav bar hidden; Cmd+E toggles it.
  // Show the bar (Cmd+E) before installing extensions so the install
  // permission prompt has a visible element to anchor to.
  let setupNavToggle = (win) => {
    try {
      let root = win.document.documentElement;
      root.setAttribute("navhidden", "true"); // start hidden
      win.addEventListener("keydown", (e) => {
        if (e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey &&
            (e.key === "e" || e.key === "E")) {
          if (root.hasAttribute("navhidden")) root.removeAttribute("navhidden");
          else root.setAttribute("navhidden", "true");
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    } catch(e) { Cu.reportError(e); }
  };
  // Apply to current + future browser windows
  Services.obs.addObserver((subject) => {
    subject.addEventListener("load", () => {
      setupNavToggle(subject);
      focusContentInWindow(subject);
    }, { once: true });
  }, "domwindowopened");
  for (let win of Services.wm.getEnumerator("navigator:browser")) setupNavToggle(win);
} catch(e) { Cu.reportError(e); }
